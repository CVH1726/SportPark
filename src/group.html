<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPark - Nhóm &amp; Câu Lạc Bộ Thể Thao</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="shared-header"></div>

    <main class="container">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">
                    <i class="fa-solid fa-users" style="color: var(--accent-orange);"></i> Nhóm &amp; Câu Lạc Bộ Thể Thao
                </h1>
                <p class="page-subtitle">Kết nối với các câu lạc bộ tập luyện thường xuyên tại hệ thống công viên Hà Nội</p>
            </div>

            <div class="filter-buttons" id="groupCategoryFilter">
                <button type="button" class="filter-btn active" data-sport="all" style="padding: 6px 14px; font-size: 13px;">Tất cả nhóm</button>
                <button type="button" class="filter-btn" data-sport="cầu lông" style="padding: 6px 14px; font-size: 13px;">Cầu lông</button>
                <button type="button" class="filter-btn" data-sport="chạy bộ" style="padding: 6px 14px; font-size: 13px;">Chạy bộ</button>
                <button type="button" class="filter-btn" data-sport="bóng rổ" style="padding: 6px 14px; font-size: 13px;">Bóng rổ</button>
            </div>
        </div>

        <div class="cards-grid" id="groupsGrid"></div>
    </main>

    <div id="shared-footer"></div>
    <div id="shared-modals"></div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        let chosenGroupSport = "all";

        document.addEventListener("DOMContentLoaded", function () {
            renderGroupsGrid(groupsList);
            setupGroupFilterButtons();
            setupGroupSearch();
        });

        // Vẽ danh sách các nhóm và câu lạc bộ thể thao
        function renderGroupsGrid(items) {
            const gridBox = document.getElementById("groupsGrid");
            if (!gridBox) {
                return;
            }

            let htmlContent = "";
            items.forEach(function (grp) {
                htmlContent += `
                    <div class="grid-card">
                        <div>
                            <div class="carousel-img-box">
                                <img src="${grp.image}" alt="${grp.name}">
                                <span class="carousel-badge" style="background:${grp.badgeColor};"><i class="fa-solid ${grp.icon}"></i></span>
                            </div>
                            <div class="card-body">
                                <div class="card-top-meta">
                                    <span class="badge-free ${grp.badgeStyle}">${grp.statusLabel}</span>
                                    <span class="member-count"><i class="fa-solid fa-user-group"></i> ${grp.members} thành viên</span>
                                </div>
                                <h3 class="card-title-white">${grp.name}</h3>
                                <p class="card-location"><i class="fa-solid fa-location-dot"></i> ${grp.park}</p>
                                <p class="card-desc">${grp.description}</p>
                            </div>
                        </div>
                        <div class="card-footer-action">
                            <button type="button" class="btn-card-action" onclick="requestJoinGroup('${grp.name}')">
                                <i class="fa-solid fa-user-plus"></i> Xin Tham Gia Nhóm
                            </button>
                        </div>
                    </div>
                `;
            });

            gridBox.innerHTML = htmlContent;
        }

        function filterGroups() {
            const searchInput = document.getElementById("globalSearchInput");
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : "";

            const matched = groupsList.filter(function (grp) {
                const matchSport = (chosenGroupSport === "all") || (grp.sport === chosenGroupSport);
                const matchKeyword =
                    (keyword === "") ||
                    grp.name.toLowerCase().includes(keyword) ||
                    grp.park.toLowerCase().includes(keyword) ||
                    grp.description.toLowerCase().includes(keyword);
                return matchSport && matchKeyword;
            });

            renderGroupsGrid(matched);
        }

        function setupGroupFilterButtons() {
            const buttons = document.querySelectorAll("#groupCategoryFilter .filter-btn");
            buttons.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    buttons.forEach(function (item) {
                        item.classList.remove("active");
                    });
                    btn.classList.add("active");
                    chosenGroupSport = btn.getAttribute("data-sport");
                    filterGroups();
                });
            });
        }

        function setupGroupSearch() {
            const searchInput = document.getElementById("globalSearchInput");
            if (searchInput) {
                searchInput.addEventListener("keyup", filterGroups);
            }
        }

        function requestJoinGroup(groupName) {
            showToast('Đã gửi yêu cầu tham gia "' + groupName + '" thành công!');
        }
    </script>
</body>
</html>
