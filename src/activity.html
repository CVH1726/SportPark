<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>SportPark - Hoạt Động &amp; Quản Lý Hoạt Động</title>

<body>

    <!-- Khung chứa Header dùng chung (do common.js tạo) -->

    <!-- Nội dung chính trang Hoạt động -->

                        <option value="yoga">Yoga ngoài trời</option>
                        <option value="bóng đá">Bóng đá</option>
                        <option value="bóng chuyền">Bóng chuyền</option>
                        <option value="đá cầu">Đá cầu</option>
                        <option value="bóng bàn">Bóng bàn</option>

                    <select id="actFilterPark" class="form-control">

                        </div>

                    </div>

                <!-- Thời gian (2): khung giờ bắt đầu / kết thúc - nhập số theo định dạng HH:MM (24 giờ) -->
                <div class="form-group">
                    <label><i class="fa-regular fa-clock"></i> Thời gian - Khung giờ</label>
                    <div class="form-grid-compact">

    <script>
        // Danh sách hoạt động do người dùng tự tạo (lưu tạm trên bộ nhớ trình duyệt)
        let myCreatedActivities = [
            {
                id: 101,
                title: "Giao lưu cầu lông chiều Thứ 3",
                sport: "cầu lông",
                park: "Công viên Thống Nhất",
                meetingPoint: "Sân cầu lông số 2 - Ven hồ Bảy Mẫu",
                date: "24/11/2026",
                schedule: "Thứ 3, 17:30 - 19:30",
                costLabel: "Miễn phí",
                level: "Người mới",
                currentParticipants: 4,
                maxParticipants: 10,
                organizer: "Hào Chu Văn",
                description: "Buổi đánh cầu lông giao lưu sau giờ học, chào đón tất cả các bạn mới tập.",
                image: "https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&q=80&w=600",
                badgeColor: "#10b981",
                icon: "fa-table-tennis-paddle-ball"
            }
        ];

        // Danh sách ID hoạt động người dùng đã bấm "Tham Gia Ngay"
        let myJoinedActivityIds = [2];

        // Danh sách đăng ký ban đầu (dùng để tính đúng số người tham gia khi bạn đăng ký / hủy thêm)
        const initialJoinedActivityIds = [2];

        // Trạng thái lịch mini của bộ lọc
        let actCalYear = 2026;
        let actCalMonth = 10; // Tháng 11 (0-indexed)
        let actSelectedDateISO = "";

        // Chuyển "HH:MM" thành số phút để so sánh khung giờ
        function timeToMinutes(timeStr) {
            if (!timeStr || !timeStr.includes(":")) {
                return null;
            }
            const parts = timeStr.split(":");
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        // Tự định dạng ô giờ khi gõ: chỉ giữ số, tối đa 4 chữ số, chèn ":" sau 2 số đầu (1830 -> 18:30)
        function formatTimeInput(inputEl) {
            const digits = inputEl.value.replace(/\D/g, "").slice(0, 4);
            inputEl.value = digits.length > 2 ? digits.slice(0, 2) + ":" + digits.slice(2) : digits;
        }

        // Đọc giờ người dùng gõ: trả về số phút, hoặc null nếu để trống / chưa gõ đủ / không hợp lệ.
        // Đồng thời đánh dấu ô sai (viền đỏ) khi đã gõ đủ nhưng giờ không hợp lệ (VD 25:70).
        function readTypedTime(inputId) {
            const el = document.getElementById(inputId);
            const value = el.value.trim();
            el.classList.remove("input-invalid");
            if (value.length < 5) {
                return { minutes: null, invalid: false };
            }
            const m = value.match(/^(\d{2}):(\d{2})$/);
            const hour = m ? parseInt(m[1], 10) : -1;
            const minute = m ? parseInt(m[2], 10) : -1;
            if (!m || hour > 23 || minute > 59) {
                el.classList.add("input-invalid");
                return { minutes: null, invalid: true };
            }
            return { minutes: hour * 60 + minute, invalid: false };
        }

        // Lấy giờ bắt đầu / kết thúc từ chuỗi lịch, VD "Thứ 3 & 5, 18:00 - 20:00" -> {start: 1080, end: 1200}
        function parseActivityTimes(schedule) {
            const m = (schedule || "").match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
            if (!m) {
                return { start: null, end: null };
            }
            return { start: timeToMinutes(m[1]), end: timeToMinutes(m[2]) };
        }

        // Lấy số tiền của hoạt động: ưu tiên costAmount, nếu không có thì đọc từ nhãn ("Miễn phí" = 0, "Có phí (30k)" = 30000)
        function getActivityCostAmount(act) {
            if (typeof act.costAmount === "number") {
                return act.costAmount;
            }
            const label = (act.costLabel || "").toLowerCase();
            if (label.includes("miễn")) {
                return 0;
            }
            const m = label.match(/(\d+)\s*k/);
            return m ? parseInt(m[1], 10) * 1000 : 0;
        }

        // "24/11/2026" -> "2026-11-24" (hoạt động chưa có ngày cụ thể trả về chuỗi rỗng)
        function viDateToISO(dateStr) {
            const parts = (dateStr || "").split("/");
            if (parts.length !== 3) {
                return "";
            }
            return parts[2] + "-" + parts[1].padStart(2, "0") + "-" + parts[0].padStart(2, "0");
        }

        // ----- Lịch mini -----
        function toggleActMiniCalendar() {
            const calBox = document.getElementById("actMiniCalendar");
            if (calBox) {
                calBox.classList.toggle("hidden");
            }
        }

        function changeActCalMonth(offset) {
            actCalMonth += offset;
            if (actCalMonth < 0) {
                actCalMonth = 11;
                actCalYear -= 1;
            } else if (actCalMonth > 11) {
                actCalMonth = 0;
                actCalYear += 1;
            }
            renderActMiniCalendar();
        }

        function renderActMiniCalendar() {
            const label = document.getElementById("actCalMonthLabel");
            const grid = document.getElementById("actCalDaysGrid");
            if (!label || !grid) {
                return;
            }

            label.innerText = "Tháng " + (actCalMonth + 1) + " / " + actCalYear;

            const firstDay = new Date(actCalYear, actCalMonth, 1).getDay();
            const startOffset = (firstDay === 0) ? 6 : (firstDay - 1); // Bắt đầu từ Thứ 2
            const daysInMonth = new Date(actCalYear, actCalMonth + 1, 0).getDate();

            let html = "";
            for (let i = 0; i < startOffset; i++) {
                html += `<span class="cal-day empty"></span>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const mm = String(actCalMonth + 1).padStart(2, "0");
                const dd = String(d).padStart(2, "0");
                const isoDate = `${actCalYear}-${mm}-${dd}`;
                const isSelected = (actSelectedDateISO === isoDate);
                const isToday = (actCalYear === 2026 && actCalMonth === 10 && d === 22);

                html += `
                    <button type="button"
                        class="cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}"
                        onclick="selectActCalendarDate('${isoDate}', '${dd}/${mm}/${actCalYear}')">
                        ${d}
                    </button>
                `;
            }
            grid.innerHTML = html;
        }

        function selectActCalendarDate(isoDate, displayDate) {
            actSelectedDateISO = isoDate;
            document.getElementById("actDateInput").value = displayDate;
            renderActMiniCalendar();
            document.getElementById("actMiniCalendar").classList.add("hidden");
            filterAndRenderActivities();
        }

        // Khởi tạo giao diện khi trang tải xong
        document.addEventListener("DOMContentLoaded", function () {
            setupActivityFilterEvents();
            renderActMiniCalendar();
            filterAndRenderActivities();
            renderManagedActivities();
            handleActivityHash();
        });

        window.addEventListener("hashchange", handleActivityHash);

        // Mở thẳng tab Quản lý và cuộn tới đúng khối khi vào trang bằng liên kết #joined (đã đăng ký) hoặc #created (đã tạo)
        function handleActivityHash() {
            const hash = window.location.hash;
            let targetId = "";
            if (hash === "#joined") {
                targetId = "joinedSection";
            } else if (hash === "#created") {
                targetId = "createdSection";
            }
            if (targetId === "") {
                return;
            }

            switchActivityTab("manage");
            setTimeout(function () {
                const target = document.getElementById(targetId);
                if (target) {
                    target.scrollIntoView({ behavior: "smooth", block: "start" });
                    target.classList.add("manage-section-highlight");
                    setTimeout(function () { target.classList.remove("manage-section-highlight"); }, 1800);
                }
            }, 60);
        }

        // Trả về danh sách hợp nhất giữa hoạt động hệ thống và hoạt động người dùng tạo
        function getCombinedActivities() {
            const formattedCreated = myCreatedActivities.map(function (item) {
                const isPaid = item.costLabel.toLowerCase().includes("phí") && !item.costLabel.toLowerCase().includes("miễn");
                return {
                    id: item.id,
                    title: item.title,
                    sport: item.sport,
                    park: item.park,
                    meetingPoint: item.meetingPoint || item.park,
                    date: item.date || "Hàng tuần",
                    schedule: item.schedule,
                    costLabel: item.costLabel,
                    badgeStyle: isPaid ? "badge-paid" : "",
                    level: item.level,
                    currentParticipants: item.currentParticipants || 1,
                    maxParticipants: item.maxParticipants || 12,
                    organizer: item.organizer || "Hào Chu Văn",
                    description: item.description || "Hoạt động cộng đồng do thành viên SportPark tổ chức.",
                    image: item.image || "https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&q=80&w=600",
                    badgeColor: item.badgeColor || "#10b981",
                    icon: item.icon || "fa-calendar-check"
                };
            });
            return activitiesList.concat(formattedCreated);
        }

        // Mở / Đóng modal tạo hoạt động mới
        function openActivityModal() {
            const modal = document.getElementById("createActivityModal");
            if (modal) {
                modal.classList.remove("hidden");
            }
        }

        function closeActivityModal() {
            const modal = document.getElementById("createActivityModal");
            if (modal) {
                modal.classList.add("hidden");
            }
        }

        function closeActivityModalOnBackdrop(event) {
            if (event.target && event.target.id === "createActivityModal") {
                closeActivityModal();
            }
        }

        // Xử lý lưu hoạt động mới từ modal
        function handleCreateActivitySubmit(event) {
            event.preventDefault();

            const title = document.getElementById("newActTitle").value.trim();
            const sport = document.getElementById("newActSport").value;
            const park = document.getElementById("newActPark").value;
            const schedule = document.getElementById("newActSchedule").value.trim();
            const maxPeople = parseInt(document.getElementById("newActMaxPeople").value, 10) || 12;
            const costLabel = document.getElementById("newActCost").value;
            const level = document.getElementById("newActLevel").value;
            const desc = document.getElementById("newActDesc").value.trim();

            if (!title || !schedule) {
                return;
            }

            const newItem = {
                id: Date.now(),
                title: title,
                sport: sport,
                park: park,
                meetingPoint: "Cổng chính " + park,
                date: "Sắp tới",
                schedule: schedule,
                costLabel: costLabel,
                level: level,
                currentParticipants: 1,
                maxParticipants: maxPeople,
                organizer: "Hào Chu Văn",
                description: desc || "Buổi giao lưu " + sport + " tại " + park + ".",
                image: "https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&q=80&w=600",
                badgeColor: "#10b981",
                icon: "fa-calendar-check"
            };

            myCreatedActivities.unshift(newItem);
            document.getElementById("createActivityForm").reset();
            closeActivityModal();
            renderManagedActivities();
            filterAndRenderActivities();
            showToast('Đã tạo hoạt động "' + title + '" thành công!');
        }

        // Chuyển đổi giữa tab Khám phá hoạt động và tab Quản lý hoạt động
        function switchActivityTab(tabName) {
            const exploreSection = document.getElementById("exploreSection");
            const manageSection = document.getElementById("manageSection");
            const tabExploreBtn = document.getElementById("tabExploreBtn");
            const tabManageBtn = document.getElementById("tabManageBtn");

            if (tabName === "manage") {
                exploreSection.classList.add("hidden");
                manageSection.classList.remove("hidden");
                tabExploreBtn.classList.remove("active");
                tabManageBtn.classList.add("active");
                renderManagedActivities();
            } else {
                manageSection.classList.add("hidden");
                exploreSection.classList.remove("hidden");
                tabManageBtn.classList.remove("active");
                tabExploreBtn.classList.add("active");
                filterAndRenderActivities();
            }
        }

        // Gắn sự kiện thay đổi cho tất cả ô lọc chi tiết và ô tìm kiếm chung trên header
        function setupActivityFilterEvents() {
            const keywordInput = document.getElementById("actKeywordInput");
            const sportSelect = document.getElementById("actFilterSport");
            const parkSelect = document.getElementById("actFilterPark");
            const levelSelect = document.getElementById("actFilterLevel");
            const globalSearchInput = document.getElementById("globalSearchInput");

            if (keywordInput) {
                keywordInput.addEventListener("input", filterAndRenderActivities);
            }
            if (sportSelect) {
                sportSelect.addEventListener("change", filterAndRenderActivities);
            }
            if (parkSelect) {
                parkSelect.addEventListener("change", filterAndRenderActivities);
            }
            // Ô giờ: tự thêm dấu ":" khi gõ số (VD gõ 1830 -> 18:30) rồi lọc ngay
            ["actTimeMin", "actTimeMax"].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener("input", function () {
                        formatTimeInput(el);
                        filterAndRenderActivities();
                    });
                }
            });
            ["actCostMin", "actCostMax", "actPeopleMin", "actPeopleMax"].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener("input", filterAndRenderActivities);
                }
            });
            if (levelSelect) {
                levelSelect.addEventListener("change", filterAndRenderActivities);
            }
            if (globalSearchInput) {
                globalSearchInput.addEventListener("keyup", function () {
                    if (keywordInput) {
                        keywordInput.value = globalSearchInput.value;
                    }
                    filterAndRenderActivities();
                });
            }
        }

        // Lọc danh sách hoạt động theo: từ khóa, môn, công viên, trình độ, chi phí, ngày, khung giờ, số lượng người
        function filterAndRenderActivities() {
            const keyword = document.getElementById("actKeywordInput").value.trim().toLowerCase();
            const selectedSport = document.getElementById("actFilterSport").value;
            const selectedPark = document.getElementById("actFilterPark").value;
            const selectedLevel = document.getElementById("actFilterLevel").value.toLowerCase();

            const minCostRaw = document.getElementById("actCostMin").value.trim();
            const maxCostRaw = document.getElementById("actCostMax").value.trim();
            const minCost = minCostRaw !== "" ? parseFloat(minCostRaw) : null;
            const maxCost = maxCostRaw !== "" ? parseFloat(maxCostRaw) : null;

            const timeMinResult = readTypedTime("actTimeMin");
            const timeMaxResult = readTypedTime("actTimeMax");
            const minMinutes = timeMinResult.minutes;
            const maxMinutes = timeMaxResult.minutes;

            // Thông báo lỗi nhập giờ (nếu có)
            const timeError = document.getElementById("actTimeError");
            if (timeMinResult.invalid || timeMaxResult.invalid) {
                timeError.textContent = "Giờ không hợp lệ. Nhập theo định dạng HH:MM (00:00 - 23:59), VD: 06:30";
                timeError.classList.remove("hidden");
            } else if (minMinutes !== null && maxMinutes !== null && minMinutes > maxMinutes) {
                timeError.textContent = "Giờ bắt đầu phải nhỏ hơn hoặc bằng giờ kết thúc.";
                timeError.classList.remove("hidden");
            } else {
                timeError.classList.add("hidden");
            }

            const minPeopleRaw = document.getElementById("actPeopleMin").value.trim();
            const maxPeopleRaw = document.getElementById("actPeopleMax").value.trim();
            const minPeople = minPeopleRaw !== "" ? parseInt(minPeopleRaw, 10) : null;
            const maxPeople = maxPeopleRaw !== "" ? parseInt(maxPeopleRaw, 10) : null;

            const allActivities = getCombinedActivities();

            const filteredItems = allActivities.filter(function (act) {
                const matchKeyword =
                    keyword === "" ||
                    act.title.toLowerCase().includes(keyword) ||
                    act.park.toLowerCase().includes(keyword) ||
                    act.sport.toLowerCase().includes(keyword);

                const matchSport =
                    selectedSport === "all" ||
                    act.sport.toLowerCase() === selectedSport.toLowerCase();

                const matchPark =
                    selectedPark === "all" ||
                    act.park === selectedPark;

                // Chi phí: nằm trong khoảng min - max
                const cost = getActivityCostAmount(act);
                const matchCost =
                    ((minCost === null || isNaN(minCost)) || cost >= minCost) &&
                    ((maxCost === null || isNaN(maxCost)) || cost <= maxCost);

                // Ngày: trùng với ngày chọn trên lịch (nếu có chọn)
                const matchDate =
                    actSelectedDateISO === "" ||
                    viDateToISO(act.date) === actSelectedDateISO;

                // Khung giờ: giờ bắt đầu >= Min và giờ kết thúc <= Max
                const times = parseActivityTimes(act.schedule);
                const matchTime =
                    (minMinutes === null || times.start === null || times.start >= minMinutes) &&
                    (maxMinutes === null || times.end === null || times.end <= maxMinutes);

                // Số lượng người: số người tối đa của hoạt động nằm trong khoảng min - max
                const capacity = act.maxParticipants || 0;
                const matchPeople =
                    ((minPeople === null || isNaN(minPeople)) || capacity >= minPeople) &&
                    ((maxPeople === null || isNaN(maxPeople)) || capacity <= maxPeople);

                const actLevelLower = act.level.toLowerCase();
                const matchLevel =
                    selectedLevel === "all" ||
                    actLevelLower.includes(selectedLevel) ||
                    (selectedLevel === "người mới" && actLevelLower.includes("mới bắt đầu")) ||
                    actLevelLower.includes("mọi trình độ");

                return matchKeyword && matchSport && matchPark && matchCost &&
                       matchDate && matchTime && matchPeople && matchLevel;
            });

            renderActivitiesGrid(filteredItems);
            document.getElementById("exploreCountBadge").innerText = filteredItems.length;
        }

        // Mở chi tiết hoạt động từ danh sách đầy đủ
        function viewActivityDetail(activityId) {
            const allActivities = getCombinedActivities();
            openActivityDetailModal(activityId, allActivities);
        }

        // Vẽ các thẻ hoạt động ở khu vực Khám phá (bấm vào thẻ hiện chi tiết hoạt động)
        function renderActivitiesGrid(items) {
            const gridBox = document.getElementById("activitiesGrid");
            if (!gridBox) {
                return;
            }

            if (items.length === 0) {
                gridBox.innerHTML = `
                    <div class="empty-activity-box">
                        <i class="fa-solid fa-person-running" style="font-size: 26px; margin-bottom: 10px; color: var(--accent-orange);"></i>
                        <p>Không có hoạt động nào khớp với bộ lọc hiện tại.</p>
                    </div>
                `;
                return;
            }

            let htmlContent = "";
            items.forEach(function (act) {
                const alreadyJoined = myJoinedActivityIds.includes(act.id);
                const isFull = act.maxParticipants && getActivityParticipantCount(act) >= act.maxParticipants;
                const buttonText = alreadyJoined ? "Đã Đăng Ký Tham Gia" : (isFull ? "Đã Đủ Người" : "Tham Gia Ngay");

                htmlContent += `
                    <div class="grid-card" style="cursor: pointer;" onclick="viewActivityDetail(${act.id})">
                        <div>
                            <div class="carousel-img-box">
                                <img src="${act.image}" alt="${act.title}">
                                <span class="carousel-badge" style="background:${act.badgeColor};"><i class="fa-solid ${act.icon}"></i></span>
                            </div>
                            <div class="card-body">
                                <div class="card-top-meta">
                                    <span class="badge-free ${act.badgeStyle}">${act.costLabel}</span>
                                    <span class="member-count">${act.level}</span>
                                </div>
                                <h3 class="card-title-white">${act.title}</h3>
                                <p class="card-location"><i class="fa-solid fa-location-dot"></i> ${act.park}</p>
                                <div class="card-time"><i class="fa-regular fa-clock"></i> ${act.schedule}</div>
                                ${buildParticipantsHtml(act)}
                            </div>
                        </div>
                        <div class="card-footer-action">
                            <button type="button" class="btn-card-action" onclick="event.stopPropagation(); joinActivityById(${act.id}, '${act.title.replace(/'/g, "\\'")}')">
                                ${buttonText}
                            </button>
                        </div>
                    </div>
                `;
            });

            gridBox.innerHTML = htmlContent;
        }

        // Đăng ký tham gia hoạt động và lưu vào danh sách quản lý của người dùng
        function joinActivityById(activityId, activityTitle) {
            if (!myJoinedActivityIds.includes(activityId)) {
                const target = getCombinedActivities().find(function (item) { return item.id === activityId; });
                if (target && target.maxParticipants && getActivityParticipantCount(target) >= target.maxParticipants) {
                    showToast('Hoạt động "' + activityTitle + '" đã đủ người tham gia.');
                    return;
                }
                myJoinedActivityIds.push(activityId);
                renderManagedActivities();
                filterAndRenderActivities();
                showToast('Đã đăng ký tham gia "' + activityTitle + '"!');
            } else {
                showToast('Bạn đã đăng ký "' + activityTitle + '" trước đó rồi.');
            }
        }

        // Hủy đăng ký một hoạt động trong khu vực Quản lý
        function leaveJoinedActivity(activityId) {
            myJoinedActivityIds = myJoinedActivityIds.filter(function (id) {
                return id !== activityId;
            });
            renderManagedActivities();
            filterAndRenderActivities();
            showToast("Đã hủy đăng ký hoạt động!");
        }

        // Xóa một hoạt động do chính người dùng tạo
        function deleteCreatedActivity(activityId) {
            myCreatedActivities = myCreatedActivities.filter(function (item) {
                return item.id !== activityId;
            });
            myJoinedActivityIds = myJoinedActivityIds.filter(function (id) {
                return id !== activityId;
            });
            renderManagedActivities();
            filterAndRenderActivities();
            showToast("Đã xóa hoạt động bạn đã tạo!");
        }

        // Vẽ danh sách hoạt động đã tạo và đã đăng ký trong tab Quản lý
        function renderManagedActivities() {
            const createdBox = document.getElementById("createdActivitiesList");
            const joinedBox = document.getElementById("joinedActivitiesList");
            const manageBadge = document.getElementById("manageCountBadge");

            // 1. Danh sách hoạt động do bạn tạo
            if (myCreatedActivities.length === 0) {
                createdBox.innerHTML = `<p style="font-size: 13px; color: var(--text-muted);">Bạn chưa tạo hoạt động nào.</p>`;
            } else {
                let createdHtml = "";
                myCreatedActivities.forEach(function (item) {
                    createdHtml += `
                        <div class="managed-item-row">
                            <div class="managed-item-info" style="cursor: pointer;" onclick="viewActivityDetail(${item.id})">
                                <h4>${item.title}</h4>
                                <div class="managed-item-meta">
                                    <span><i class="fa-solid fa-location-dot" style="color: var(--accent-orange);"></i> ${item.park}</span>
                                    <span><i class="fa-regular fa-clock"></i> ${item.schedule}</span>
                                    <span><i class="fa-solid fa-tags"></i> ${item.costLabel}</span>
                                    <span><i class="fa-solid fa-user-group"></i> ${getActivityParticipantCount(item)}/${item.maxParticipants} người tham gia</span>
                                </div>
                            </div>
                            <div class="managed-item-actions">
                                <button type="button" class="btn-danger-outline" onclick="deleteCreatedActivity(${item.id})">
                                    <i class="fa-solid fa-trash"></i> Xóa hoạt động
                                </button>
                            </div>
                        </div>
                    `;
                });
                createdBox.innerHTML = createdHtml;
            }

            // 2. Danh sách hoạt động bạn đã đăng ký tham gia
            const allActivities = getCombinedActivities();
            const joinedItems = allActivities.filter(function (act) {
                return myJoinedActivityIds.includes(act.id);
            });

            if (joinedItems.length === 0) {
                joinedBox.innerHTML = `<p style="font-size: 13px; color: var(--text-muted);">Bạn chưa đăng ký tham gia hoạt động nào.</p>`;
            } else {
                let joinedHtml = "";
                joinedItems.forEach(function (act) {
                    joinedHtml += `
                        <div class="managed-item-row">
                            <div class="managed-item-info" style="cursor: pointer;" onclick="viewActivityDetail(${act.id})">
                                <h4>${act.title}</h4>
                                <div class="managed-item-meta">
                                    <span><i class="fa-solid fa-location-dot" style="color: var(--accent-orange);"></i> ${act.park}</span>
                                    <span><i class="fa-regular fa-clock"></i> ${act.schedule}</span>
                                    <span><i class="fa-solid fa-tags"></i> ${act.costLabel}</span>
                                    <span><i class="fa-solid fa-user-group"></i> ${getActivityParticipantCount(act)}/${act.maxParticipants} người tham gia</span>
                                </div>
                            </div>
                            <div class="managed-item-actions">
                                <button type="button" class="btn-danger-outline" onclick="leaveJoinedActivity(${act.id})">
                                    <i class="fa-solid fa-circle-xmark"></i> Hủy đăng ký
                                </button>
                            </div>
                        </div>
                    `;
                });
                joinedBox.innerHTML = joinedHtml;
            }

            if (manageBadge) {
                manageBadge.innerText = myCreatedActivities.length + joinedItems.length;
            }
        }

        // Đặt lại toàn bộ bộ lọc chi tiết về mặc định
        function resetActivityFilters() {
            document.getElementById("actKeywordInput").value = "";
            document.getElementById("actFilterSport").value = "all";
            document.getElementById("actFilterPark").value = "all";
            document.getElementById("actFilterLevel").value = "all";
            document.getElementById("actCostMin").value = "";
            document.getElementById("actCostMax").value = "";
            document.getElementById("actDateInput").value = "";
            document.getElementById("actTimeMin").value = "";
            document.getElementById("actTimeMax").value = "";
            document.getElementById("actTimeMin").classList.remove("input-invalid");
            document.getElementById("actTimeMax").classList.remove("input-invalid");
            document.getElementById("actPeopleMin").value = "";
            document.getElementById("actPeopleMax").value = "";
            actSelectedDateISO = "";
            renderActMiniCalendar();
            document.getElementById("actMiniCalendar").classList.add("hidden");

            const globalSearchInput = document.getElementById("globalSearchInput");
            if (globalSearchInput) {
                globalSearchInput.value = "";
            }

            filterAndRenderActivities();
            showToast("Đã đặt lại bộ lọc hoạt động!");
        }
    </script>
</body>
</html>
