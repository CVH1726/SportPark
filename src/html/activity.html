<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPark - Danh Sách Hoạt Động Thể Thao</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="shared-header"></div>

    <main class="container">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">
                    <i class="fa-solid fa-person-running" style="color: var(--accent-orange);"></i> Hoạt Động Thể Thao Cộng Đồng
                </h1>
                <p class="page-subtitle">Tham gia các buổi giao lưu, tập luyện cùng cộng đồng tại các công viên Hà Nội</p>
            </div>

            <div class="filter-buttons" id="activityCategoryFilter">
                <button type="button" class="filter-btn active" data-sport="all" style="padding: 6px 14px; font-size: 13px;">Tất cả</button>
                <button type="button" class="filter-btn" data-sport="cầu lông" style="padding: 6px 14px; font-size: 13px;">Cầu lông</button>
                <button type="button" class="filter-btn" data-sport="chạy bộ" style="padding: 6px 14px; font-size: 13px;">Chạy bộ</button>
                <button type="button" class="filter-btn" data-sport="bóng rổ" style="padding: 6px 14px; font-size: 13px;">Bóng rổ</button>
            </div>
        </div>

        <div class="cards-grid" id="activitiesGrid"></div>
    </main>

    <div id="shared-footer"></div>
    <div id="shared-modals"></div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        let chosenSportFilter = "all";

        document.addEventListener("DOMContentLoaded", function () {
            renderActivitiesGrid(activitiesList);
            setupActivityFilterButtons();
            setupActivitySearch();
        });

        // Vẽ danh sách thẻ hoạt động thể thao
        function renderActivitiesGrid(items) {
            const gridBox = document.getElementById("activitiesGrid");
            if (!gridBox) {
                return;
            }

            let htmlContent = "";
            items.forEach(function (act) {
                htmlContent += `
                    <div class="grid-card">
                        <div>
                            <div class="carousel-img-box">
                                <img src="${act.image}" alt="${act.title}">
                                <span class="carousel-badge" style="background:${act.badgeColor};"><i class="fa-solid ${act.icon}"></i></span>
                            </div>
                            <div class="card-body">
                                <span class="badge-free ${act.badgeStyle}">${act.costLabel}</span>
                                <h3 class="card-title-white">${act.title}</h3>
                                <p class="card-location"><i class="fa-solid fa-location-dot"></i> ${act.park}</p>
                                <div class="card-time"><i class="fa-regular fa-clock"></i> ${act.schedule}</div>
                            </div>
                        </div>
                        <div class="card-footer-action">
                            <button type="button" class="btn-card-action" onclick="joinActivity('${act.title}')">Tham Gia Ngay</button>
                        </div>
                    </div>
                `;
            });

            gridBox.innerHTML = htmlContent;
        }

        // Lọc hoạt động theo môn thể thao và từ khóa tìm kiếm
        function filterActivities() {
            const searchInput = document.getElementById("globalSearchInput");
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : "";

            const matched = activitiesList.filter(function (act) {
                const matchSport = (chosenSportFilter === "all") || (act.sport === chosenSportFilter);
                const matchKeyword =
                    (keyword === "") ||
                    act.title.toLowerCase().includes(keyword) ||
                    act.park.toLowerCase().includes(keyword) ||
                    act.sport.toLowerCase().includes(keyword);
                return matchSport && matchKeyword;
            });

            renderActivitiesGrid(matched);
        }

        function setupActivityFilterButtons() {
            const buttons = document.querySelectorAll("#activityCategoryFilter .filter-btn");
            buttons.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    buttons.forEach(function (item) {
                        item.classList.remove("active");
                    });
                    btn.classList.add("active");
                    chosenSportFilter = btn.getAttribute("data-sport");
                    filterActivities();
                });
            });
        }

        function setupActivitySearch() {
            const searchInput = document.getElementById("globalSearchInput");
            if (searchInput) {
                searchInput.addEventListener("keyup", filterActivities);
            }
        }

        function joinActivity(activityName) {
            showToast('Đã đăng ký tham gia "' + activityName + '" thành công!');
        }
    </script>
</body>
</html>
