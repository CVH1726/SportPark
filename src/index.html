<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPark - Khám phá thể thao công viên</title>
    <!-- Thư viện bản đồ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Bộ icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font chữ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- File CSS giao diện chung -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Khung chứa Header dùng chung (do common.js tạo) -->
    <div id="shared-header"></div>

    <!-- Nội dung chính Trang chủ -->
    <main class="container">
        <!-- Khu vực trên: Bản đồ bên trái + Bộ lọc thông minh bên phải -->
        <div class="grid-2cols" style="margin-bottom: 24px;">
            <div class="col-8 map-card">
                <div class="map-badge">
                    <span class="dot-pulse"></span>
                    <span id="mapCounter">Đang tải bản đồ...</span>
                </div>
                <div id="map"></div>
            </div>

            <div class="col-4 filter-panel">
                <div class="filter-header">
                    <h2><i class="fa-solid fa-sliders" style="color:var(--accent-teal);"></i> Bộ lọc thông minh</h2>
                    <button type="button" onclick="resetHomeFilters()">Đặt lại</button>
                </div>

                <div class="filter-scroll-area">
                    <div class="filter-group">
                        <label>Môn Thể Thao</label>
                        <div class="filter-buttons" id="sportFilters">
                            <button type="button" class="filter-btn active" data-category="sport" data-value="all">all</button>
                            <button type="button" class="filter-btn" data-category="sport" data-value="cầu lông">cầu lông</button>
                            <button type="button" class="filter-btn" data-category="sport" data-value="chạy bộ">chạy bộ</button>
                            <button type="button" class="filter-btn" data-category="sport" data-value="bóng rổ">bóng rổ</button>
                            <button type="button" class="filter-btn" data-category="sport" data-value="gym">gym</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Công Viên</label>
                        <div class="filter-buttons" id="parkFilters">
                            <button type="button" class="filter-btn active" data-category="park" data-value="all">All</button>
                            <button type="button" class="filter-btn" data-category="park" data-value="Thống Nhất">Thống Nhất</button>
                            <button type="button" class="filter-btn" data-category="park" data-value="Cầu Giấy">Cầu Giấy</button>
                            <button type="button" class="filter-btn" data-category="park" data-value="Nghĩa Đô">Nghĩa Đô</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Thời Gian</label>
                        <div class="filter-buttons" id="timeFilters">
                            <button type="button" class="filter-btn active" data-category="time" data-value="all">tất cả</button>
                            <button type="button" class="filter-btn" data-category="time" data-value="sáng">sáng</button>
                            <button type="button" class="filter-btn" data-category="time" data-value="chiều">chiều</button>
                            <button type="button" class="filter-btn" data-category="time" data-value="tối">tối</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Chi Phí</label>
                        <div class="filter-buttons" id="costFilters">
                            <button type="button" class="filter-btn active" data-category="cost" data-value="all">miễn phí &amp; có phí</button>
                            <button type="button" class="filter-btn" data-category="cost" data-value="miễn phí">miễn phí</button>
                            <button type="button" class="filter-btn" data-category="cost" data-value="có phí">có phí</button>
                            <button type="button" class="filter-btn" data-category="cost" data-value="<100k">&lt;100k</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Trình Độ</label>
                        <div class="filter-buttons" id="levelFilters">
                            <button type="button" class="filter-btn active" data-category="level" data-value="all">mọi trình độ</button>
                            <button type="button" class="filter-btn" data-category="level" data-value="mới bắt đầu">mới bắt đầu</button>
                            <button type="button" class="filter-btn" data-category="level" data-value="trung bình">trung bình</button>
                            <button type="button" class="filter-btn" data-category="level" data-value="nâng cao">nâng cao</button>
                        </div>
                    </div>
                </div>

                <button type="button" onclick="applyHomeFilters()" class="btn-apply-filter">Áp Dụng Bộ Lọc</button>
            </div>
        </div>

        <!-- Khu vực dưới: Hàng thẻ công viên nổi bật + Danh sách hoạt động sắp tới -->
        <div class="grid-2cols">
            <div class="col-8">
                <div class="section-header-row">
                    <h2 class="section-title"><i class="fa-solid fa-fire" style="color:var(--accent-orange);"></i> Địa điểm &amp; Công Viên Nổi Bật</h2>
                    <div class="carousel-controls">
                        <button type="button" onclick="scrollCarousel(-1)" class="carousel-arrow-btn"><i class="fa-solid fa-chevron-left"></i></button>
                        <button type="button" onclick="scrollCarousel(1)" class="carousel-arrow-btn"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="carousel-container" id="carouselContainer"></div>
            </div>

            <div class="col-4">
                <h2 class="section-title"><i class="fa-solid fa-calendar-days" style="color:var(--accent-teal);"></i> Hoạt Động Sắp Tới</h2>
                <div class="activity-list" id="upcomingActivities"></div>
            </div>
        </div>
    </main>

    <!-- Khung chứa Footer, Modal và Toast dùng chung -->
    <div id="shared-footer"></div>
    <div id="shared-modals"></div>

    <!-- Các file JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
