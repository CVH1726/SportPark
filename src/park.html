<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPark - Danh Sách Công Viên Thể Thao</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="shared-header"></div>

    <main class="container">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">
                    <i class="fa-solid fa-tree" style="color: var(--accent-teal);"></i> Hệ Thống Công Viên Thể Thao Tại Hà Nội
                </h1>
                <p class="page-subtitle">Khám phá không gian xanh, đường chạy và các khu vực tập luyện ngoài trời</p>
            </div>
        </div>

        <div class="cards-grid" id="parksGrid"></div>
    </main>

    <div id="shared-footer"></div>
    <div id="shared-modals"></div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderParksGrid(parksList);
            setupParkSearch();
        });

        // Vẽ danh sách thẻ công viên từ mảng parksList
        function renderParksGrid(items) {
            const gridBox = document.getElementById("parksGrid");
            if (!gridBox) {
                return;
            }

            let htmlContent = "";
            items.forEach(function (park) {
                let sportsHtml = "";
                park.sports.forEach(function (sp) {
                    sportsHtml += `<span><i class="fa-solid ${sp.icon}" style="color: ${sp.color};"></i> ${sp.name}</span>`;
                });

                htmlContent += `
                    <div class="grid-card" onclick="window.location.href='map.html'">
                        <div>
                            <div class="carousel-img-box">
                                <img src="${park.image}" alt="${park.name}">
                                <span class="carousel-badge"><i class="fa-solid fa-location-dot"></i></span>
                            </div>
                            <div class="card-body">
                                <span class="card-district">${park.district}</span>
                                <h3 class="card-title-white">${park.name}</h3>
                                <p class="card-desc">${park.description}</p>
                                <div class="card-sports-row">${sportsHtml}</div>
                            </div>
                        </div>
                        <div class="card-footer-action">
                            <button type="button" class="btn-card-action">
                                <i class="fa-solid fa-map-location-dot"></i> Xem Bản Đồ Chi Tiết Công Viên
                            </button>
                        </div>
                    </div>
                `;
            });

            gridBox.innerHTML = htmlContent;
        }

        // Lọc công viên theo từ khóa tìm kiếm trên header
        function setupParkSearch() {
            const searchInput = document.getElementById("globalSearchInput");
            if (!searchInput) {
                return;
            }

            searchInput.addEventListener("keyup", function () {
                const keyword = searchInput.value.trim().toLowerCase();
                const filteredParks = parksList.filter(function (park) {
                    return (
                        park.name.toLowerCase().includes(keyword) ||
                        park.district.toLowerCase().includes(keyword) ||
                        park.description.toLowerCase().includes(keyword)
                    );
                });
                renderParksGrid(filteredParks);
            });
        }
    </script>
</body>
</html>
