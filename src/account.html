<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPark - Tài khoản cá nhân</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="shared-header"></div>

    <main class="container">
        <div class="grid-2cols" style="align-items: start;">
            <!-- Cột trái: Thông tin hồ sơ và menu phụ -->
            <div class="col-4">
                <div class="profile-card">
                    <img src="https://marketplace.canva.com/tXH-Q/MAG7IGtXH-Q/1/tl/canva-MAG7IGtXH-Q.jpg" alt="Avatar" class="profile-avatar">
                    <h2 class="profile-name-lg">Hào Chu Văn</h2>
                    <p class="profile-role">Thành viên SportPark</p>

                    <div class="profile-stats">
                        <div>
                            <div class="stat-value-teal">12</div>
                            <div class="stat-label">Hoạt động tham gia</div>
                        </div>
                        <div>
                            <div class="stat-value-orange">3</div>
                            <div class="stat-label">Đã tạo</div>
                        </div>
                    </div>
                </div>

                <div class="account-menu-card">
                    <a href="#profile-edit" class="account-menu-item active">
                        <i class="fa-solid fa-id-card" style="color: var(--accent-teal);"></i> Thông tin cá nhân
                    </a>
                    <a href="activity.html" class="account-menu-item">
                        <i class="fa-solid fa-calendar-check" style="color: var(--accent-orange);"></i> Hoạt động đã đăng ký
                    </a>
                    <a href="#profile-edit" class="account-menu-item">
                        <i class="fa-solid fa-gear"></i> Cài đặt tài khoản
                    </a>
                    <a href="index.html" class="account-menu-item account-menu-logout">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                    </a>
                </div>
            </div>

            <!-- Cột phải: Form chỉnh sửa thông tin cá nhân -->
            <div class="col-8" id="profile-edit">
                <div class="account-form-card">
                    <h2 class="account-form-title">
                        <i class="fa-solid fa-user-pen" style="color: var(--accent-teal);"></i> Chỉnh Sửa Thông Tin Cá Nhân
                    </h2>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Họ và Tên</label>
                            <input type="text" id="accFullName" value="Hào Chu Văn" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Email liên hệ</label>
                            <input type="email" id="accEmail" value="haochuvan@example.com" class="form-control">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="text" id="accPhone" value="0912 345 678" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Môn thể thao yêu thích</label>
                            <select id="accSport" class="form-control">
                                <option>Cầu Lông</option>
                                <option>Chạy Bộ</option>
                                <option>Bóng Rổ</option>
                                <option>Gym / Calisthenics</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Giới thiệu bản thân / Mục tiêu tập luyện</label>
                        <textarea id="accBio" class="form-control" rows="3" style="resize: none;">Đam mê cầu lông và chạy bộ tại các công viên khu vực Hà Nội. Mong muốn kết nối cộng đồng thể thao lành mạnh.</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" onclick="cancelAccountChanges()" class="btn-cancel">Hủy thay đổi</button>
                        <button type="button" onclick="saveAccountChanges()" class="btn-save">Lưu Thay Đổi</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="shared-footer"></div>
    <div id="shared-modals"></div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        // Khôi phục lại dữ liệu mặc định khi bấm Hủy thay đổi
        function cancelAccountChanges() {
            document.getElementById("accFullName").value = "Hào Chu Văn";
            document.getElementById("accEmail").value = "haochuvan@example.com";
            document.getElementById("accPhone").value = "0912 345 678";
            document.getElementById("accSport").selectedIndex = 0;
            document.getElementById("accBio").value = "Đam mê cầu lông và chạy bộ tại các công viên khu vực Hà Nội. Mong muốn kết nối cộng đồng thể thao lành mạnh.";
            showToast("Đã hủy các thay đổi!");
        }

        // Thông báo khi lưu thay đổi hồ sơ cá nhân
        function saveAccountChanges() {
            showToast("Đã lưu thông tin cá nhân thành công!");
        }
    </script>
</body>
</html>
