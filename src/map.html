<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPark - Bản Đồ Địa Điểm Thể Thao</title>
    <!-- Leaflet JS & CSS cho Bản đồ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="main.css">
    <style>
        #map {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 550px;
            flex: 1;
            z-index: 10;
        }
        /* Tùy chỉnh select box nâng cao cho bộ lọc danh sách mở rộng */
        .filter-select {
            width: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus {
            border-color: var(--accent-teal);
        }
    </style>
</head>
<body>

    <!-- Header & Menu -->
    <header>
        <div class="container">
            <div class="header-top">
                <div class="logo-box" onclick="window.location.href='index.html'">
                    <div class="logo-icon">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <div class="logo-text">
                        <span>Sport<em>Park</em></span>
                        <div class="logo-sub">Khám phá thể thao công viên</div>
                    </div>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Tìm môn thể thao, công viên, địa chỉ trên bản đồ...">
                    <button><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>

                <div class="user-profile">
                    <button style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size: 18px; position:relative;">
                        <i class="fa-regular fa-bell"></i>
                        <span style="position:absolute; top:0; right:0; width:8px; height:8px; background:var(--accent-orange); border-radius:50%;"></span>
                    </button>
                    <a href="account.html" style="display:flex; align-items:center; gap:8px; border-left:1px solid var(--border-color); padding-left:12px; text-decoration:none; color:inherit;">
                        <img src="https://marketplace.canva.com/tXH-Q/MAG7IGtXH-Q/1/tl/canva-MAG7IGtXH-Q.jpg" alt="Avatar" class="avatar">
                        <span style="font-size:14px; font-weight:500;" class="hidden-mobile">Hào Chu Văn</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="sub-nav-bar">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <nav class="nav-links">
                    <a href="index.html"><i class="fa-solid fa-house"></i> Trang Chủ</a>
                    <a href="map.html" class="active"><i class="fa-solid fa-map-location-dot"></i> Bản Đồ</a>
                    <a href="park.html"><i class="fa-solid fa-tree"></i> Công Viên</a>
                    <a href="activity.html"><i class="fa-solid fa-person-running"></i> Hoạt Động</a>
                    <a href="group.html"><i class="fa-solid fa-users"></i> Nhóm</a>
                    <a href="account.html"><i class="fa-solid fa-user"></i> Tài Khoản</a>
                </nav>
                <button onclick="openRegisterModal()" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Đăng Ký Hoạt Động
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content: Bản đồ & Bộ lọc danh sách mở rộng -->
    <main class="container" style="margin-top: 20px; margin-bottom: 24px;">
        <div class="grid-2cols">
            
            <!-- Cột trái: Bản đồ Leaflet -->
            <div class="col-8 map-card">
                <div class="map-badge">
                    <span class="dot-pulse"></span>
                    <span id="mapCounter">Đang tải bản đồ...</span>
                </div>
                <div id="map"></div>
            </div>

            <!-- Cột phải: Bộ lọc dạng danh sách mở rộng (Dropdown List) -->
            <div class="col-4 filter-panel">
                <div class="filter-header">
                    <h2><i class="fa-solid fa-sliders" style="color:var(--accent-teal);"></i> Bộ Lọc Danh Sách</h2>
                    <button onclick="resetFilters()">Đặt lại</button>
                </div>

                <div style="display:flex; flex-direction:column; gap:14px; overflow-y:auto; max-height:450px; padding-right:4px;">
                    
                    <!-- 1. Môn Thể Thao (List mở rộng) -->
                    <div class="filter-group">
                        <label><i class="fa-solid fa-dumbbell"></i> Môn Thể Thao</label>
                        <select id="filterSport" class="filter-select">
                            <option value="all">-- Tất cả môn thể thao --</option>
                            <option value="cầu lông">Cầu lông</option>
                            <option value="chạy bộ">Chạy bộ</option>
                            <option value="bóng rổ">Bóng rổ</option>
                            <option value="gym">Gym / Calisthenics</option>
                            <option value="bóng đá">Bóng đá</option>
                            <option value="đạp xe">Đạp xe</option>
                            <option value="yoga">Yoga ngoài trời</option>
                        </select>
                    </div>

                    <!-- 2. Công Viên (List mở rộng) -->
                    <div class="filter-group">
                        <label><i class="fa-solid fa-tree"></i> Công Viên / Khu Vực</label>
                        <select id="filterPark" class="filter-select">
                            <option value="all">-- Tất cả công viên tại Hà Nội --</option>
                            <option value="Thống Nhất">Công viên Thống Nhất</option>
                            <option value="Cầu Giấy">Công viên Cầu Giấy</option>
                            <option value="Nghĩa Đô">Công viên Nghĩa Đô</option>
                            <option value="Bách Thảo">Công viên Bách Thảo</option>
                            <option value="Hòa Bình">Công viên Hòa Bình</option>
                            <option value="Yên Sở">Công viên Yên Sở</option>
                        </select>
                    </div>

                    <!-- 3. Thời Gian (List mở rộng) -->
                    <div class="filter-group">
                        <label><i class="fa-regular fa-clock"></i> Khung Thời Gian</label>
                        <select id="filterTime" class="filter-select">
                            <option value="all">-- Tất cả thời gian --</option>
                            <option value="sáng">Buổi sáng (05:00 - 10:00)</option>
                            <option value="chiều">Buổi chiều (14:00 - 18:00)</option>
                            <option value="tối">Buổi tối (18:00 - 22:00)</option>
                        </select>
                    </div>

                    <!-- 4. Chi Phí (List mở rộng) -->
                    <div class="filter-group">
                        <label><i class="fa-solid fa-tags"></i> Mức Chi Phí</label>
                        <select id="filterCost" class="filter-select">
                            <option value="all">-- Tất cả (Miễn phí & Có phí) --</option>
                            <option value="miễn phí">Miễn phí hoàn toàn</option>
                            <option value="có phí">Có phí / Thuê sân</option>
                            <option value="<100k">Dưới 100.000đ</option>
                        </select>
                    </div>

                    <!-- 5. Trình Độ (List mở rộng) -->
                    <div class="filter-group">
                        <label><i class="fa-solid fa-chart-line"></i> Trình Độ Yêu Cầu</label>
                        <select id="filterLevel" class="filter-select">
                            <option value="all">-- Mọi trình độ --</option>
                            <option value="mới bắt đầu">Mới bắt đầu / Nhập môn</option>
                            <option value="trung bình">Trung bình</option>
                            <option value="nâng cao">Nâng cao / Chuyên nghiệp</option>
                        </select>
                    </div>

                </div>

                <button onclick="applyFilters()" class="btn-apply-filter">Áp Dụng Bộ Lọc</button>
            </div>

        </div>
    </main>   

    <!-- Footer -->
    <footer>
        <div class="container footer-flex">
            <div class="footer-links">
                <a href="#">Về chúng tôi</a>
                <a href="#">Liên hệ</a>
                <a href="#">Điều khoản sử dụng</a>
            </div>
            <div style="display:flex; gap:16px; font-size: 16px;">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    <!-- Modal Đăng Ký Hoạt Động -->
    <div id="registerModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square" style="color:var(--accent-orange);"></i> Đăng Ký Hoạt Động Mới</h3>
                <button onclick="closeRegisterModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group">
                <label>Tên hoạt động / Tên nhóm</label>
                <input type="text" placeholder="Ví dụ: Giao lưu cầu lông chiều T3" class="form-control">
            </div>
            <div class="form-group">
                <label>Công viên chọn</label>
                <select class="form-control">
                    <option>Công viên Thống Nhất</option>
                    <option>Công viên Cầu Giấy</option>
                    <option>Công viên Nghĩa Đô</option>
                    <option>Công viên Bách Thảo</option>
                </select>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
                <button onclick="closeRegisterModal()" style="background:#334155; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:12px;">Hủy</button>
                <button onclick="submitRegister()" style="background:var(--accent-orange); color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:12px;">Đăng Ký</button>
            </div>
        </div>
    </div>

    <!-- Toast thông báo -->
    <div id="toast">
        <i class="fa-solid fa-circle-check" style="font-size: 16px;"></i>
        <span id="toastMsg">Thao tác thành công!</span>
    </div>

    <!-- JavaScript Xử lý Bản đồ và Lọc danh sách mở rộng -->
    <script>
        const sportLocations = [
            { id: 1, name: "Công viên Thống Nhất", sport: "cầu lông", park: "Thống Nhất", time: "sáng", cost: "miễn phí", level: "mới bắt đầu", lat: 21.0135, lng: 105.8450, address: "Hồ Bảy Mẫu, Hai Bà Trưng", color: "#10b981", icon: "fa-table-tennis-paddle-ball" },
            { id: 2, name: "Công viên Thống Nhất", sport: "chạy bộ", park: "Thống Nhất", time: "chiều", cost: "miễn phí", level: "mọi trình độ", lat: 21.0150, lng: 105.8430, address: "Đường chạy quanh hồ", color: "#2563eb", icon: "fa-person-running" },
            { id: 3, name: "Công viên Cầu Giấy", sport: "chạy bộ", park: "Cầu Giấy", time: "sáng", cost: "miễn phí", level: "trung bình", lat: 21.0227, lng: 105.7937, address: "Khu thể thao Cầu Giấy", color: "#2563eb", icon: "fa-person-running" },
            { id: 4, name: "Sân Bóng Rổ Cầu Giấy", sport: "bóng rổ", park: "Cầu Giấy", time: "tối", cost: "có phí", level: "nâng cao", lat: 21.0240, lng: 105.7950, address: "Sân bóng rổ tiêu chuẩn", color: "#d97706", icon: "fa-basketball" },
            { id: 5, name: "Công viên Nghĩa Đô", sport: "gym", park: "Nghĩa Đô", time: "sáng", cost: "có phí", level: "mới bắt đầu", lat: 21.0422, lng: 105.7985, address: "Khu Calisthenics Nghĩa Đô", color: "#8b5cf6", icon: "fa-dumbbell" }
        ];

        let map = L.map('map').setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        function renderMarkers(data) {
            markersGroup.clearLayers();
            data.forEach(item => {
                let customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marker-pin" style="background:${item.color};"><i class="fa-solid ${item.icon}"></i></div>`,
                    iconSize: [30, 42],
                    iconAnchor: [15, 42]
                });
                let marker = L.marker([item.lat, item.lng], { icon: customIcon });
                marker.bindPopup(`<b>${item.name}</b><br>${item.address}<br><em>Môn: ${item.sport}</em>`);
                markersGroup.addLayer(marker);
            });
            document.getElementById('mapCounter').innerText = `Hiển thị ${data.length} địa điểm thể thao`;
        }

        renderMarkers(sportLocations);

        // Hàm áp dụng bộ lọc từ các thẻ <select> danh sách mở rộng
        function applyFilters() {
            const selectedSport = document.getElementById('filterSport').value;
            const selectedPark = document.getElementById('filterPark').value;
            const selectedTime = document.getElementById('filterTime').value;
            const selectedCost = document.getElementById('filterCost').value;
            const selectedLevel = document.getElementById('filterLevel').value;

            const filtered = sportLocations.filter(item => {
                let matchSport = (selectedSport === 'all' || item.sport === selectedSport);
                let matchPark = (selectedPark === 'all' || item.park.includes(selectedPark));
                let matchTime = (selectedTime === 'all' || item.time === selectedTime);
                let matchCost = (selectedCost === 'all' || item.cost === selectedCost);
                let matchLevel = (selectedLevel === 'all' || item.level === selectedLevel || item.level === 'mọi trình độ');
                return matchSport && matchPark && matchTime && matchCost && matchLevel;
            });

            renderMarkers(filtered);
            showToast(`Đã lọc được ${filtered.length} địa điểm phù hợp!`);
        }

        // Đặt lại tất cả bộ lọc về mặc định
        function resetFilters() {
            document.getElementById('filterSport').value = 'all';
            document.getElementById('filterPark').value = 'all';
            document.getElementById('filterTime').value = 'all';
            document.getElementById('filterCost').value = 'all';
            document.getElementById('filterLevel').value = 'all';
            document.getElementById('searchInput').value = '';
            
            renderMarkers(sportLocations);
            showToast("Đã đặt lại bộ lọc bản đồ!");
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) { renderMarkers(sportLocations); return; }
            const searched = sportLocations.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.sport.toLowerCase().includes(keyword) || 
                item.address.toLowerCase().includes(keyword)
            );
            renderMarkers(searched);
        }

        function openRegisterModal() { document.getElementById('registerModal').classList.remove('hidden'); }
        function closeRegisterModal() { document.getElementById('registerModal').classList.add('hidden'); }
        function submitRegister() { closeRegisterModal(); showToast("Đăng ký hoạt động thành công!"); }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
